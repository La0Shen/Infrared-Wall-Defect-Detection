# 方案一(单帧基线管线)默认参数
# 与 总体方案.md 第5节"合并参数表"对应;现场验证后按第7节流程回调。

preprocess:
  emissivity: 0.90          # 发射率 ε,统一初值(砖0.90/混凝土0.92后续细分)
  reflected_temp_c: 20.0    # 反射环境温度(℃),用于辐射校正
  denoise_kernel: 3         # 中值滤波核尺寸(仅支持 3/5,大于 5 自动钳制为 5)
  distance_m: null          # 拍摄距离(m);填写后计算 GSD 与缺陷物理面积
  gsd_divisor: 540          # GSD 系数:Mavic 3T 约为 距离/540 (m/px)

detect:
  detrend_sigma_px: 20      # 去趋势高斯模糊 σ(px)= 2~3 × 缺陷半径,按 GSD 换算
  mad_scale: 1.4826         # MAD 换算为噪声标准差的比例系数

  z_threshold: 1.5          # z 分数阈值,|z| 超过即判为异常

  min_area_px: 20           # 最小斑块面积(px),小于此面积剔除   最初为20

  #边界带:照片最外 N px 视为墙,不参与检测(本项目新增,不在 总体方案.md §5)
  border_ignore_px: 15      # 0=不过滤(旧行为);窗外未拍全、边界外无墙可比,
                            # 会在边界产生大量伪影(实测 test01 有 12 个斑块
                            # 挤在左边缘 x=0)。被切过的斑块形状不可信,不再
                            # 参与形状渗漏规则。设太大会吃掉真实墙面

features:
  ring_kernel: 5            # 外围环带膨胀核尺寸(px),用于计算局部温差 ΔT

classify:
  # 四条判定规则(总体方案.md §4)。定性条件默认关闭,与伪代码一致;
  # 开启后与全图平均边缘锐度(sharp_ref)比较。
  window_rect: 0.85             # 窗户:矩形度下限
  window_dt_c: -5.0             # 窗户:ΔT 上限(℃)
  window_require_sharp: true   # 窗户:开启"边界锐利"条件
  hollow_dt_c: 1.5              # 空鼓:ΔT 下限(℃)
  hollow_rect: 0.8              # 空鼓:矩形度上限
  hollow_require_diffuse: false # 空鼓:开启"边界弥散"条件
  seepage_dt_c: -1.5            # 渗水:ΔT 上限(℃)
  seepage_elong: 1.5            # 渗水:伸长率下限
  seepage_require_vertical: false # 渗水:开启"长轴偏垂直"条件
  seepage_angle_tol_deg: 20     # 长轴与竖直方向夹角容差(°)

  # 形状渗漏规则(本项目新增,不在 总体方案.md §4):矩形度高 + 细长即判渗漏,
  # 不看 ΔT——规则的矩形形状比温差更能说明问题(实测 ΔT 阈值漏掉形状确定的
  # 规则渗水)。优先级在窗户之后、上方 ΔT 规则之前。
  seepage_rect: 0.80            # 形状渗漏:矩形度下限
  seepage_rect_elong: 2.0       # 形状渗漏:纵横比下限(取 minAreaRect 长轴/短轴,
                                # 即特征的 elong,旋转不变;与上方 seepage_elong
                                # 是同一个量,只是分属两条规则)
  seepage_shape_require_cold: false # 形状渗漏:是否要求 ΔT 低于下行下限
  seepage_shape_dt_c: -0.8      # 形状渗漏:ΔT 上限(℃);仅上一行为 true 时生效。
                                # 实测 test01 上启用可挡掉全部 6 个弱信号(真渗水
                                # dT=-1.70,其余全 ≥-0.55),按现场情况决定是否开

window_mask:
  # 窗户掩膜:识别为窗户后,整个窗户区域不作为识别条件(窗户反光会造成
  # 窗内温度不均,产生大量虚假候选)。第一遍用宽松阈值+闭运算找窗户区域
  # (窗户整体仅略冷于墙面,检测层阈值抓不到),第二遍排除掩膜内的斑块。
  enabled: true                 # false=关闭掩膜(恢复旧行为)
  z_threshold: 1.5              # 冷掩膜 z 阈值(比检测层宽松;窗户整体仅略冷,
                                # 1.5 才能把反光打碎的窗户合并成完整区域块)
  close_direct: 3               # 直接路径闭运算核:只填窗内反光孔洞,不合并相邻窗
  close_kernel: 11              # 块路径闭运算核:合并成排/成列的窗户区域块
  min_area_px: 1500             # 区域块最小面积(滤小碎块)
  dT_max_c: 0.1                 # 块均值与图像中位数之差上限:只滤明显暖的
                                # 去趋势边缘伪影(dT>+1);窗户反光强烈时
                                # 整体可不偏冷,故上限设正
  rect_direct: 0.85             # 直接矩形路径:最小外接矩形度下限
  aspect_min: 0.15              # 块路径宽高比下限(与 aspect_max 互为倒数)
  aspect_max: 6.67              # 块路径宽高比上限。原为 0.08/12.5,不足以挡住细长条:
                                # 原以为"渗水是实心细条 rect≈1",但实测有 rect 仅 0.44、
                                # 宽高比 0.131(长/宽 7.6)的贯穿全画幅冷条被当成窗户区域
                                # 块。真正的窗区块宽高比在 2~3 附近,故收紧;更细长的
                                # 按渗漏交给检测层判
  block_aspect_lo: 0.5          # 块路径仅接受明显细长的块(宽高比 <0.5 或 >2.0):
  block_aspect_hi: 2.0          # 近方形的冷块多为去趋势伪影/普通冷区,不按窗户
  dilate_px: 2                  # 基础膨胀(盖住窗框)
  grow_tol_c: 0.2               # 过渡带生长停止:环带中位温度回到
                                # "更外参考带 − grow_tol_c" 以上即停(℃);
                                # 设小些把过渡带吃干净,残余≈本值
  grow_max_px: 10               # 过渡带生长步数上限(兜底防无界扩张;
                                # 0=关闭自适应生长,仅用 dilate_px)
  exclude_overlap: 0.5          # 候选斑块与掩膜覆盖率超过此值即排除
  inpaint_radius: 3             # cv2.inpaint(NS) 修复半径(px):谐波延续背景填充;
                                # 不用 Telea——它在过渡带斜坡边界上会产生
                                # ±1℃ 棋盘纹,被下一段检测报成整片斑块

display:
  # 叠加图显示控制:只影响 overlay.png 画哪些斑块,方便人工复核看图;
  # defects.csv / summary.json(含 counts)/ mask_NNN_*.png 仍为全量,不受影响。
  # 本项目新增,不在 总体方案.md §5 参数表内(总体方案.md 无此概念)。
  #   show_*      : 1=显示,0=不显示
  #   min_len_*_px: 边框 max(宽, 高) 小于此值不显示(px;0=全部显示)
  # overlay 上的编号沿用斑块在缺陷列表中的下标,与 defects.csv 的 index 列、
  # mask_NNN_*.png 的 NNN 一一对应;被过滤的斑块只跳过绘制、不重新编号,
  # 故图上编号可能不连续。
  show_window: 1                # 窗户:是否显示
  show_hollow: 1                # 空鼓:是否显示
  show_seepage: 1               # 渗水:是否显示
  show_reject: 0                # 兜底未分类(非缺陷):是否显示;白框噪声多时可设 0
  min_len_window_px: 0          # 窗户:边框长度下限(px)
  min_len_hollow_px: 0          # 空鼓:边框长度下限(px)
  min_len_seepage_px: 0         # 渗水:边框长度下限(px)
  min_len_reject_px: 0          # 兜底未分类:边框长度下限(px)

rect_mask:
  # 绝对矩形掩膜法(**调试用**,本项目新增,不在 总体方案.md 内)。
  # 思路:直接对图片做转码——把温度图按"与全图中位数的绝对温差"转成二维二值
  # 矩阵,再对其中**规则粗边矩形**做掩埋处理。判据是绝对的:阈值是℃不是 z 分数,
  # 不依赖噪声统计,也不做局部背景扣除。
  # 规则 = 四边逼近恰 4 顶点 + 凸 + 四角近 90°;粗边 = 最粗处 ≥ min_edge_px。
  # 实心矩形与粗边框都算(判据是"边够粗",不是"必须是环形")。
  # 调试时留意三点:
  #   ⚠ dt_c 是本方法的主要旋钮,取值影响很大(实测值见下)。
  #   ⚠ approx_eps 决定能否凑出"恰 4 顶点":2% 会给出 6~10 个顶点而被否掉。
  #   ⚠ min_edge_px 在实测数据上从未生效过(test01 扫遍 dt_c 0.3~4.0,候选边宽
  #     最小也有 14px)。它是防发丝细线的护栏,不是主力判据。
  enabled: 0                    # 0=关闭,1=启用
  dt_c: 2.0                     # 绝对温差(℃):|T − median(T)| > 此值即转成 1。
                                # 实测参考:合成场景的 ΔT=−1.5℃ 冷方块 dt=0.5 就
                                # 完整找到;demo 场景 dt=3.0 恰好找到那个窗;
                                # 真实帧 dt=1.0~3.0 给出几个矩形,二值占比 26%→10%
  morph_close: 3                # 转码后的闭运算核(补轮廓断口;0=不做)
  approx_eps: 0.05              # 四边逼近精度(占周长比例)
  angle_tol_deg: 15             # 四角与 90° 的容差(°)
  min_area_px: 300              # 矩形最小面积(px)
  min_side_ratio: 0.15          # 短边/长边 下限(挡细长条,与 aspect_min 同口径)
  min_edge_px: 3.0              # 最小边宽(px):矩形内前景像素到最近背景像素的
                                # 最大距离 ×2 = 最粗处的宽度。粗边框量到的是带宽、
                                # 实心块量到的是短边。发丝细线也能凑出"恰 4 顶点",
                                # 但不是粗边;0=不设门槛。
                                # 实测 1px 细线 = 2.0px,真实窗框/实心块 = 14~92px
  dilate_px: 2                  # 掩膜膨胀(px)
  inpaint_radius: 3             # NS 修复半径(px);同 window_mask



#窗户渗漏再检定
window_guard:
  # 窗形渗漏保护(**本项目新增**,不在 总体方案.md 内;算法全部在
  # src/thermal_inspect/window_guard.py)。窗户掩膜的块路径为了合并成排/成列的
  # 窗户,接受 rect ≤ 0.85 且宽高比 ∈ [0.15, 6.67] 的细长冷块;一条**连续均匀的
  # 细长冷带**也落在这个接受域里(实测 test02 左柱:原始冷块 41×378、长宽比 9.4,
  # 闭运算与邻栋楼冷碎块合并后 rect 0.307、宽高比 0.256),于是被整块当成窗户掩掉,
  # 真渗漏从缺陷清单里消失(实测输出 {'window': 2, 'reject': 85}、零渗漏)。
  # 本段让这类块先过下面三道"像不像窗户"的判据,三条都不成立才按渗漏输出。
  #
  # ⚠ 本段由 window_guard.py **自行读取,不经过 Params**(config.py 一行未动),
  #   故 Params 不认识这一段;键名写错仍会按主配置的严格口径报错。
  #   代码默认值见 WindowGuardParams;这里写出来等于把实测值固定下来。
  #
  # 判据(三条"是窗户"的口径,**任一条成立**就仍按窗户;三条都不成立才判渗漏):
  #   ① 外接框内 z > warm_z 的像素占比 > warm_frac_max   (内部有更暖的子结构)
  #   ② 块内 |∇T| > edge_k×σ_noise 的像素占比 > edge_frac_max (内部有窗框类强边缘)
  #   ③ 边缘规整度 = (1 − 偏离直线px/edge_dev_ref_px) × (1 − 突出占比) ≥ regular_min
  #      (上/下沿对最小二乘直线的平均偏差 = 边缘像不像一条直线;超 edge_tol_px 的占比
  #       = 不规则突出/凹陷占多大比例。两者都小才是"人造直边物")
  # 实测 test02:左柱 ①0.009 ②0.0000 ③0.767(三条都不成立 → 判渗漏);
  # 中部窗排 ①0.285 ②0.0141(①成立 → 仍是窗户;且它长宽比 2.52 < 门槛,压根不进判据)。
  #

  # ── 口径开关(想单看某一条口径的效果,关掉另外两条即可,不用去动阈值)──
  # 每个开关写 true/false(或 0/1 都认);关掉的那条**不参与判决**,但指标照算,
  # 数值仍打进控制台那行 [info](先看数值,再决定要不要开)。
  # 三条全关 = 极端狭长且内部均衡的块一律释放成渗漏(等于只剩 elong_min 一道门)。
  # 关整条保护请用下面的 enabled,别用这三个开关。
  warm_on: true                 # ①:内部有没有明显更暖的子结构(窗格/反光)
  edge_on: true                 # ②:内部有没有窗框/格栅那种强边缘
  regular_on: true            # ③:边缘十分规整(人造直边物)
  enabled: true              # false=关闭整条保护(恢复旧行为:狭长冷块仍按窗户掩掉)
  elong_min: 4.0                # 极端狭长门槛:主导原始冷块 长边/短边(minAreaRect)。
                                # 实测真窗排/窗区块 1.1~2.7(test01 三窗、test01 窗区块
                                # 2.72、test02 中部窗排 2.52),误判的连续冷带 9.43
  warm_z: 1.5                   # ①:内部"暖子结构"的 z 门槛(与冷掩膜同量级)
  warm_frac_max: 0.10           # ①上限:暖像素占比 > 此值即"有暖子结构"
  edge_k: 0.85                  # ②:强边缘门槛 = edge_k × σ_noise(℃/px);
                                # 实测 σ=0.176℃ → 0.15℃/px
  edge_frac_max: 0.005          # ②上限:强边缘占比 > 此值即"有内部结构"
  regular_min: 0.5              # ③:规整度 ≥ 此值即视为窗户,不释放。实测:人造直边物
                                # (窗间墙柱/接缝)0.65~1.00、真渗漏(test02 左柱)与各类
                                # 毛糙冷斑 0.00 → 0.5 落在中间,两头都不贴边。
                                # 设 0 = 恒判"规整"(保护不再释放任何块)
                                # ——正常关这条口径请用 regular_on
  edge_dev_ref_px: 1.0          # ③第一项:"多直才算直"的参照(px)。上/下沿到各自最小
                                # 二乘直线的平均偏差 = 此值 → 这一项归零。1px 的道理:
                                # 像素化本身有 ±0.5px 锯齿底噪,一条真直边也就该在 1px
                                # 内。实测 人造直边物 0.13~0.29px、真渗漏 1.96px
  edge_tol_px: 2.0              # ③第二项:"多大算突出"(px)。偏差超过它的剖面点算一个
                                # 不规则突出/凹陷,其占比是第二项。实测 人造直边物
                                # 0.000~0.031、真渗漏 0.312

seepage_guard:
  # 渗漏保护(**本项目新增**,不在 总体方案.md 内;算法全部在
  # src/thermal_inspect/seepage_guard.py)。classify.py 的**形状渗漏规则**
  # (rect > 0.80 且 elong > 2.0,**不看 ΔT**)把"细长的冷东西"一律判成渗水;
  # 实测 test04 上它给出的 12 个渗漏里,用户真值**只有最右侧一条是真的**,其余 10 个
  # 是**窗间墙柱与横向接缝**这类人造直边物(边缘规整度 0.65~1.00)。
  # 本段把"边缘太直"的渗漏改判为非缺陷(reject)。
  #
  # ⚠ 与 window_guard 同款:本段由 seepage_guard.py **自行读取,不经过 Params**
  #   (config.py 一行未动);键名写错仍按主配置的严格口径报错。
  #
  # 细线(几 px 高)也判:细长的冷线实测是**窗户隔板、横向接缝**这类人造构造
  # (test01 那条 2px 线 = 窗户隔板,test04 四条 3~5px 线 = 横向接缝),不是渗水。
  # 曾经默认 min_short_px=5 想保护 test01 那条 2px 线——**用户更正它是隔板、是假渗水**
  # 之后,这个前提没了。
  enabled: true                 # 开关:false=完全不做改判(恢复旧行为)
  regular_min: 0.5              # 边缘规整度 ≥ 此值 → 像人造直边物 → 改判非缺陷。
                                # 实测 人造直边物(窗间墙柱)0.71~1.00、毛糙渗漏
                                # (test02 左柱 0.00、test04 唯一真渗漏 0.30)都远在下方
  min_short_px: 0.0             # 短边 < 此值(px)不判;默认 0 = 细线也判(见上)
  edge_dev_ref_px: 1.0          # 边缘口径:子口径①"多直才算直"的参照(px)
  edge_tol_px: 2.0              # 边缘口径:子口径②"多大算突出"(px)
                                # (这两个与 window_guard 同名同默认,有用例钉住一致)

  # ── 边缘口径的两个子口径,各自可开关(用户要求拆开)──
  # 规整度 = 开着那几项的乘积:
  #   ① 直线拟合度 = 1 − 上/下沿到最小二乘直线的平均偏离 ÷ edge_dev_ref_px
  #   ② 突出占比   = 1 − 偏离超 edge_tol_px 的剖面点占比
  # 两项都关 = 恒判"规整"(等于全部改判)——要关整条规则请用上面的 enabled,别用这两个。
  # 关掉一项时,控制台那行 [info] 会写明"只算直线拟合"/"只算突出占比"。
  # 实测两者的分工:一条直边带子上鼓起一个包 —— ① 说"不直了"(0.06)、② 还说"占比不大"
  # (0.81);两者都算则取乘积(0.05)。要单看哪一项说了算,把另一项关掉即可。
  line_on: true                 # 子口径①:边缘到底像不像一条直线
  prot_on: true                # 子口径②:不规则突出占多大比例

  # ── classify.py 那两条"渗水鉴定规则"的总开关(**classify.py 一行未改**)──
  # 关掉的那条规则**永不成立**:做法是把它的阈值推到不可能达到的值
  #   shape_rule_on=false → classify.seepage_rect 置 +∞(rect 理论上 ≤1,实测取整后
  #                          会到 1.04,故不能用"贴着上界"的 1.01)
  #   dt_rule_on   =false → classify.seepage_dt_c 置 -∞(温差不可能更低)
  # 实现见 seepage_guard.effective_classify_params();用的是**副本**,
  # summary.json 的参数快照仍是上面 classify 段里的真值,不会被悄悄改写。
  # ⚠ 这是把闸刀,不是精细旋钮:形状规则一关,它判出来的渗漏(含真渗漏,如
  #   test04 那条 (380,274,10,30))会一起消失。要挑着关请用上面的边缘口径。
  shape_rule_on: true           # 形状渗漏规则(rect > 0.80 且 elong > 2.0,不看 ΔT)
  dt_rule_on: true          # ΔT 渗漏规则(dT < seepage_dt_c 且 elong > seepage_elong)
